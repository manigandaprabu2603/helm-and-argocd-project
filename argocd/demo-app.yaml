apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    # Replace with the HTTPS or SSH clone URL for this Git repository.
    repoURL: https://github.com/YOUR_ORG/helm-and-argocd-project.git
    targetRevision: HEAD
    path: charts/child
    helm:
      releaseName: demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
